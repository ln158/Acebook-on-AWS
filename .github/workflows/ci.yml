name: Simple CI

on:
  push:
    branches:
      - main
      - ci-test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm test
        env:
          PORT: 3030
          MONGODB_URL: mongodb://127.0.0.1:27017/acebook_test